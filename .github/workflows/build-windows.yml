name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Empaquetar con PyInstaller
        id: version
        shell: pwsh
        run: |
          $version = python installer/make_version_info.py
          "version=$version" >> $env:GITHUB_OUTPUT
          pyinstaller --noconfirm --clean botcontrol.spec

      - name: Prueba de arranque del ejecutable
        shell: pwsh
        env:
          BOTCONTROL_HOME: ${{ runner.temp }}\botcontrol-selftest
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\BotControl\BotControl.exe" -ArgumentList "--selftest", "`"$out`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "BotControl.exe terminó con código $($p.ExitCode)" }
          $content = Get-Content $out
          Write-Host $content
          if (-not ($content -like "ok*")) { throw "La prueba de arranque falló" }

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Crear instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\BotControl.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló" }

      - name: Prueba de instalación silenciosa
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\BotControl-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "BotControlInstall"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "El instalador terminó con código $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir "BotControl.exe"))) { throw "No se instaló BotControl.exe" }
          $un = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          if ($un.ExitCode -ne 0) { throw "El desinstalador terminó con código $($un.ExitCode)" }

      - name: Comprimir versión portable
        shell: pwsh
        run: Compress-Archive -Path dist\BotControl\* -DestinationPath "dist\installer\BotControl-Portable-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: BotControl-${{ steps.version.outputs.version }}
          path: dist/installer/*
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*
